<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="" />
    <meta name="keywords" content="" />
    <meta name="author" content="Khalid Nur" />
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />
    <title>Spots</title>
  </head>
  <body>
    <div class="page">
      <header class="header">
        <img
  src="<%= require('./images/logo.svg').default %>"
  alt="Spot logo"
  class="header__logo"
/>
      </header>
      <main class="content">
        <section class="profile page__section">
          <div class="profile__avatar-container">
            <button class="profile__avatar-btn">
              <img
              src="<%= require('./images/pencil light.svg').default %>"
              alt="Profile icon"
            />
            </button>
            <img
  src="<%= require('./images/avatar.jpg').default %>"
  alt="Profile avatar"
  class="profile__avatar"
/>
          </div>

          <div class="profile__column">
            <h1 class="profile__name">Bessie Coleman</h1>
            <p class="profile__description">Civil Aviator</p>
            <button type="button" class="profile__edit-btn">
              <img
  src="<%= require('./images/icon.svg').default %>"
  alt="Edit profile button"
/>Edit
              Profile
            </button>
          </div>
          <button type="button" class="profile__add-btn">
            <img
  src="<%= require('./images/plus.svg').default %>"
  alt="New post button"
/>New Post
          </button>
        </section>
        <section class="cards page__section">
          <ul class="cards__list">
            <template id="card-template">
              <li class="card">
                <button
                  type="button"
                  class="card__delete-button"
                  aria-label="Delete card"
                ></button>
                <img class="card__image" src="" alt="" />
                <div class="card__footer">
                  <h2 class="card__title"></h2>
                  <button
                    aria-label="Like card"
                    type="button"
                    class="card__like-button"
                  ></button>
                </div>
              </li>
            </template>
          </ul>
        </section>
      </main>
      <footer class="footer page__section">
        <p class="footer__text">2025 &copy; Spots</p>
      </footer>
      <div class="modal" id="edit-modal">
        <div class="modal__container">
          <button type="button" class="modal__close-btn">
            <img
              src="<%= require('./images/close.svg').default %>"
              alt="Close modal button"
            />
          </button>
          <h2 class="modal__title">Edit profile</h2>
          <form id="edit-profile-form" class="modal__form">
            <label for="profile-name-input" class="modal__label">
              Name
              <input
                id="profile-name-input"
                class="modal__input"
                name="name"
                placeholder="Type your name"
                type="text"
                required
                minlength="2"
                maxlength="40"
              />
              <span class="form__input-error"></span>
            </label>
            <label for="profile-description-input" class="modal__label">
              Description
              <input
                id="profile-description-input"
                class="modal__input"
                name="description"
                placeholder="Describe yourself"
                type="text"
                required
                minlength="2"
                maxlength="200"
              />
              <span class="form__input-error"></span>
            </label>
            <button type="submit" class="modal__submit-btn">Save</button>
          </form>
        </div>
      </div>

      <div class="modal" id="add-card-modal">
        <div class="modal__container">
          <button type="button" class="modal__close-btn">
            <img
              src="<%= require('./images/close.svg').default %>"
              alt="Close modal button"
            />
          </button>          
          <h2 class="modal__title">New post</h2>
          <form id="add-card-form" class="modal__form">
            <label for="add-card-link-input" class="modal__label">
              Image link
              <input
                id="add-card-link-input"
                class="modal__input"
                name="link"
                placeholder="Paste a link to the picture"
                type="url"
                required
              />
              <span class="form__input-error"></span>
            </label>
            <label for="add-card-name-input" class="modal__label">
              Caption
              <input
                id="add-card-name-input"
                class="modal__input"
                name="name"
                placeholder="Type your caption"
                type="text"
                required
                minlength="2"
                maxlength="30"
              />
              <span class="form__input-error"></span>
            </label>
            <button type="submit" class="modal__submit-btn">Save</button>
          </form>
        </div>
      </div>

      <div class="modal" id="preview-modal">
        <div class="modal__container modal__container_type_preview">
          <button
            type="button"
            class="modal__close-btn modal__close-btn_type_preview"
            aria-label="Close modal button"
          ></button>
          <img src="" alt="" class="modal__preview-image" />
          <p class="modal__caption">Golden Gate Bridge</p>
        </div>
      </div>

      <div class="modal modal_type_avatar" id="avatar-modal">
        <div class="modal__content">
          <button
            aria-label="Close modal"
            class="modal__close modal__close_type_avatar"
            type="button"
          ></button>
          <h3 class="modal__title">Change Profile Picture</h3>
          <form class="modal__form" id="avatar-form">
            <input
              type="url"
              name="avatarLink"
              class="modal__input modal__input_type_avatar-link"
              placeholder="Link to new profile picture"
              required
            />
            <button class="modal__save-btn" type="submit">Save</button>
          </form>
        </div>
      </div>

      <div class="modal" id="delete-modal">
        <div class="modal__container">
          <button
            aria-label="Close modal"
            class="modal__close-btn"
            type="button"
          ></button>
          <h3 class="modal__title">
            Are you sure you want to delete this image?
          </h3>
          <form class="modal__form" id="delete__form">
            <button
              class="modal__button modal__button_type_delete"
              type="submit"
            >
              Delete
            </button>
            <button
              class="modal__button modal__button_type_cancel"
              type="button"
            >
              Cancel
            </button>
          </form>
        </div>
      </div>
    </div>
  </body>
</html>
